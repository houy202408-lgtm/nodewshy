<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>酷炫网站首页</title>
    <style>
        /* 基本的重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #3498db, #8e44ad);
            color: white;
            overflow-x: hidden;
        }

        /* 页面容器 */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* 标题 */
        h1 {
            font-size: 4em;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeIn 2s ease-in-out;
            margin-bottom: 20px;
        }

        /* 动效渐显 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 描述文字 */
        p {
            font-size: 1.5em;
            animation: slideIn 2s ease-in-out;
            margin-bottom: 30px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 按钮 */
        .btn {
            padding: 15px 30px;
            background-color: #e74c3c;
            color: white;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #c0392b;
            transform: scale(1.1);
        }

        /* 响应式布局 */
        @media (max-width: 768px) {
            h1 {
                font-size: 3em;
            }
            p {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到我们的酷炫网站</h1>
        <p>体验不一样的设计，走在科技前沿。</p>
        <a href="#" class="btn">了解更多</a>
    </div>
</body>
</html>
